<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal_OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">

  <main id="workspace">
    <div class="shortcut" data-app="notes">
      <div class="icon">📝</div>
      <span>Notes</span>
    </div>
    <div class="shortcut" data-app="calc">
      <div class="icon">🔢</div>
      <span>Calculator</span>
    </div>
    <div class="shortcut" data-app="console">
      <div class="icon">💻</div>
      <span>Console</span>
    </div>
    <div class="shortcut" data-app="settings">
      <div class="icon">⚙️</div>
      <span>Settings</span>
    </div>
  </main>

  <aside id="launcher" class="hidden">
    <div class="user-strip">user@local-machine</div>
    <ul>
      <li data-app="notes">Text Editor</li>
      <li data-app="calc">Calculator</li>
      <li data-app="console">Command Prompt</li>
      <li data-app="settings">Theme Settings</li>
    </ul>
  </aside>

  <footer id="panel">
    <button id="start-btn">Menu</button>
    <div id="active-tasks"></div>
    <time id="clock">--:--</time>
  </footer>

  <template id="tpl-notes">
    <div class="app-notes">
      <textarea id="scratchpad" placeholder="Type something..."></textarea>
    </div>
  </template>

  <template id="tpl-calc">
    <div class="app-calc">
      <input type="text" id="calc-screen" readonly value="0">
      <div class="calc-keys">
        <button class="key-fn" data-key="clear">C</button>
        <button class="key-fn" data-key="back">⌫</button>
        <button class="key-op" data-key="/">÷</button>
        <button class="key-op" data-key="*">×</button>
        <button class="key-num" data-key="7">7</button>
        <button class="key-num" data-key="8">8</button>
        <button class="key-num" data-key="9">9</button>
        <button class="key-op" data-key="-">-</button>
        <button class="key-num" data-key="4">4</button>
        <button class="key-num" data-key="5">5</button>
        <button class="key-num" data-key="6">6</button>
        <button class="key-op" data-key="+">+</button>
        <button class="key-num" data-key="1">1</button>
        <button class="key-num" data-key="2">2</button>
        <button class="key-num" data-key="3">3</button>
        <button class="key-eq" data-key="=">=</button>
        <button class="key-num key-zero" data-key="0">0</button>
        <button class="key-num" data-key=".">.</button>
      </div>
    </div>
  </template>

  <template id="tpl-console">
    <div class="app-console">
      <div class="output-log"></div>
      <div class="input-line">
        <span class="prompt">$</span>
        <input type="text" class="cmd-input" spellcheck="false" autocomplete="off">
      </div>
    </div>
  </template>

  <template id="tpl-settings">
    <div class="app-settings">
      <label>Interface Theme</label>
      <select id="theme-picker">
        <option value="dark">Monokai Dark</option>
        <option value="emerald">Matrix Emerald</option>
        <option value="amber">Retro Amber</option>
      </select>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
